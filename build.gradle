plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.github.onakrainikoff'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
    withJavadocJar()
    withSourcesJar()
}

dependencies {
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'commons-io:commons-io:2.16.1'
    implementation("org.apache.httpcomponents.client5:httpclient5:5.6.5")
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.4'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "org.wiremock:wiremock-standalone:3.13.2"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            pom {
                name = 'reloadable-resource-4j'
                description = 'Spring integration of the reloadable-resource-4j library'
                url = 'https://github.com/onakrainikoff/reloadable-resource-4j'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
        }
    }
}